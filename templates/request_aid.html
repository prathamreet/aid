{% extends "base.html" %}

{% block title %}Request Aid - Micro-Lending{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-md p-8">
        <h2 class="text-2xl font-bold mb-6">Submit Aid Request</h2>
        <form method="POST" action="{{ url_for('aid.request_aid') }}">
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Category</label>
                <select name="category" required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="">Select a category...</option>
                    {% for category in categories %}
                        <option value="{{ category }}">{{ category }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Amount Needed (₹)</label>
                <input type="number" name="amount" step="0.01" min="1" required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="e.g., 5000">
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-2">Purpose / Reason</label>
                <textarea name="purpose" rows="5" required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="Describe why you need this aid..."></textarea>
            </div>
            
            <button type="submit" 
                class="w-full bg-indigo-600 text-white py-3 rounded-md hover:bg-indigo-700 font-medium">
                Submit Request
            </button>
        </form>
    </div>
</div>
{% endblock %}
